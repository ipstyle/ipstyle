<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-labelledby="t">
  <title id="t">ipstyle — native apps for Mac and iPhone</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f25"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8dfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5b8dfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="290" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="290" fill="url(#bg)"/>
    <circle cx="1010" cy="250" r="300" fill="url(#glow)"/>
    <circle cx="170" cy="40" r="230" fill="url(#glow)"/>

    <!-- menu bar -->
    <rect width="1200" height="48" fill="#0f1115" fill-opacity="0.55"/>
    <rect y="47.5" width="1200" height="1" fill="#2a2e36"/>

    <!-- left: app name + menu titles -->
    <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e9eaee">ipstyle</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#a0a6b0">
      <text x="108" y="30">Apps</text>
      <text x="162" y="30">Source</text>
      <text x="228" y="30">Privacy</text>
    </g>

    <!-- right: status items -->
    <!-- AI-Cockpit: ring gauge -->
    <circle cx="884" cy="24" r="8" fill="none" stroke="#3a4049" stroke-width="2.6"/>
    <path d="M884 16 A 8 8 0 1 1 876.76 27.41" fill="none" stroke="#5b8dfa" stroke-width="2.6" stroke-linecap="round"/>
    <text x="899" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e9eaee">68%</text>

    <!-- BarBox glyph -->
    <rect x="952" y="19.5" width="24" height="9" rx="4.5" fill="#e9eaee"/>
    <rect x="955" y="22" width="6" height="4" rx="2" fill="#14161a"/>
    <circle cx="968" cy="24" r="1.5" fill="#14161a"/>
    <circle cx="972" cy="24" r="1.5" fill="#14161a"/>

    <!-- battery -->
    <rect x="1002" y="17.5" width="23" height="12" rx="3.5" fill="none" stroke="#e9eaee" stroke-opacity="0.45"/>
    <rect x="1004.5" y="20" width="14" height="7" rx="1.5" fill="#e9eaee"/>
    <path d="M1027 21.5v4" stroke="#e9eaee" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

    <!-- wifi -->
    <g fill="none" stroke="#e9eaee" stroke-width="2" stroke-linecap="round">
      <path d="M1050 21 A 15 15 0 0 1 1074 21"/>
      <path d="M1055 26 A 8.5 8.5 0 0 1 1069 26"/>
    </g>
    <circle cx="1062" cy="29.5" r="2" fill="#e9eaee"/>

    <!-- clock -->
    <text x="1160" y="29" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#e9eaee">9:41</text>

    <!-- wordmark -->
    <text x="600" y="182" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-3" fill="#f2f3f6">ipstyle</text>
    <text x="600" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#a0a6b0">native apps for Mac and iPhone</text>
    <text x="600" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#5b8dfa" font-weight="600">two on the Mac App Store &#183; nothing leaves your device</text>

    <rect x="0.5" y="0.5" width="1199" height="289" rx="16" fill="none" stroke="#2a2e36"/>
  </g>
</svg>
