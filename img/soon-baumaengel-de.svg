<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t">
  <title id="t">Baumängel Tracker — Räume mit offenen Mängeln und PDF-Protokoll</title>
  <defs>
    <clipPath id="r"><rect width="880" height="440" rx="22"/></clipPath>
    <radialGradient id="g" cx="0.85" cy="0.1" r="0.7">
