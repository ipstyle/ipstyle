      <stop offset="1" stop-color="#ed852e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#r)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="880" height="440" fill="#1b1d22"/>
    <rect width="880" height="440" fill="url(#g)"/>

    <text x="62" y="76" font-size="28" font-weight="700" fill="#e9eaee">Baumängel Tracker</text>
