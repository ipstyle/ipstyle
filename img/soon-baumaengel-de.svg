      <rect x="80" y="208" width="38" height="38" rx="9" fill="#3a2c1c"/>
      <path d="M89 236l9-11 7 8 5-5 8 8z" fill="#ed852e"/><circle cx="93" cy="219" r="3.5" fill="#ed852e"/>
      <text x="136" y="234" font-size="23" fill="#e9eaee">Küche</text>
      <rect x="470" y="223" width="200" height="8" rx="4" fill="#34343a"/>
